# Security headers, included by every location in nginx.conf.
# (nginx drops inherited add_header directives as soon as a location defines
# one of its own, hence a shared file rather than a single server-level block.)

# The script/style policy is emitted per page by Astro as a <meta http-equiv>
# with hashes. These directives either cannot be set from a meta tag
# (frame-ancestors) or are worth enforcing before the document is parsed.
add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
# Only honoured over HTTPS (ignored on http://localhost).
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), browsing-topics=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
