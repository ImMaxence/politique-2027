# Politique 2027 — static site served by nginx (unprivileged, port 8080).
# TLS is terminated upstream by the Coolify proxy / Cloudflare.

# Root URL: answer in the visitor's language. French unless the browser's
# first choice is another language.
map $http_accept_language $root_lang {
    default      fr;
    ~*^fr        fr;
    ~*^[a-z]     en;
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    charset utf-8;
    server_tokens off;
    absolute_redirect off;

    # Privacy: no access log, as stated in the privacy policy. Errors only.
    access_log off;
    error_log /dev/stderr warn;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/plain text/css text/xml application/javascript application/json
               application/manifest+json application/xml image/svg+xml;

    include /etc/nginx/snippets/security-headers.conf;

    # A static site only ever answers GET and HEAD.
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    # Health check used by Docker / Coolify.
    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    location = / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Vary "Accept-Language" always;
        add_header Cache-Control "no-cache" always;
        return 302 /$root_lang;
    }

    # Canonical URLs carry no trailing slash and no .html.
    location ~ ^/(.+)/$ {
        return 301 /$1$is_args$args;
    }
    location ~ ^/(.+)\.html$ {
        return 301 /$1$is_args$args;
    }

    # Photo heads: their names carry the hash of their content (scripts/build-heads.ts).
    location ^~ /heads/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Hashed build assets: cache forever. (^~ keeps the regex locations below out of it.)
    location ^~ /_astro/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # security.txt (RFC 9116) lives in a dot-directory; nothing else there is served.
    location = /.well-known/security.txt {
        include /etc/nginx/snippets/security-headers.conf;
        default_type text/plain;
        add_header Cache-Control "public, max-age=86400" always;
    }
    location ~ /\. {
        return 404;
    }

    # Icons, social card and other files from public/.
    location ~* \.(?:png|svg|ico|webp|woff2?)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    # The service worker must be revalidated every time, so that a release reaches the players.
    location = /sw.js {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    location = /site.webmanifest {
        include /etc/nginx/snippets/security-headers.conf;
        types { }
        default_type application/manifest+json;
        add_header Cache-Control "public, max-age=86400" always;
    }

    # Pages are built as /fr.html, /fr/jouer.html… and served without the extension.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
        try_files $uri $uri.html =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }
}
